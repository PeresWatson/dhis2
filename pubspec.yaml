name: dhis2
description: "A DHIS2 mobile app project."

# Prevents accidental publication to pub.dev
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  d2_touch: ^1.1.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.14

flutter:
  # Enables the use of Material Design icons
  uses-material-design: true